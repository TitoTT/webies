<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Error del servidor - IES Trancas</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif; color: #444; background: #F4F6F9;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .caja {
      background: #fff; border-radius: 12px; border-top: 6px solid #F86106;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 560px; width: 100%; padding: 48px 32px; text-align: center;
    }
    .codigo { font-family: Georgia, serif; font-size: clamp(72px, 20vw, 120px); line-height: 1; color: #003366; }
    .codigo span { color: #F86106; }
    h1 { font-size: 24px; color: #003366; margin: 14px 0; }
    p { font-size: 16px; line-height: 1.7; margin-bottom: 28px; }
    a {
      display: inline-block; background: #F86106; color: #001A33;
      padding: 12px 26px; border-radius: 6px; font-weight: 700; font-size: 14px;
      text-decoration: none;
    }
    a:hover { background: #F0B942; }
    .inst { margin-top: 28px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <main class="caja">
    <div class="codigo">5<span>0</span>0</div>
    <h1>Algo salió mal de nuestro lado</h1>
    <p>Tuvimos un problema al cargar esta página. Ya estamos al tanto. Probá recargar en unos minutos; si el problema continúa, comunicate con el instituto.</p>
    <a href="/">Volver al inicio</a>
    <div class="inst">IES Trancas · Instituto de Educación Superior</div>
  </main>
</body>
</html>
